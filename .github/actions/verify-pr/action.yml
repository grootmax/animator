name: 'Verify PR'
description: 'Runs setup, build, typecheck, lint, and test steps for pull request verification'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build
      run: pnpm build
      shell: bash

    - name: Typecheck
      run: pnpm typecheck
      shell: bash

    - name: Lint
      run: pnpm lint
      shell: bash

    - name: Test
      run: pnpm test
      shell: bash
