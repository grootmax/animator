# The only CI workflow. One job, one runner, one check name ("CI") for branch protection.
# Target: green in ~1-2 minutes. Don't add matrices, perf suites or other workflows without an ADR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older, still-running CI instead of queueing behind it.
# Runs on main are never cancelled, so every merged commit gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  CI:
    runs-on: ubuntu-latest
    # A hung test fails fast instead of holding a runner for the 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
