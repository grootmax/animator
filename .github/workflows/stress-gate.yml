name: Automated Engine Stress Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  stress-test:
    name: 100k Node Performance Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run Engine Stress Test
        run: pnpm exec tsx packages/scene-graph/src/stress-test.ts
