name: Multi-OS Integrity Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
      
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers (Linux)
      if: runner.os == 'Linux'
      run: npx playwright install --with-deps

    - name: Install Playwright browsers (macOS / Windows)
      if: runner.os != 'Linux'
      run: npx playwright install

    - name: Build project
      run: pnpm build

    - name: Run E2E Tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm run test:e2e
      
    - name: Run E2E Tests (Windows / macOS)
      if: runner.os != 'Linux'
      run: pnpm run test:e2e

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ matrix.os }}
        path: apps/editor/playwright-report/
        retention-days: 7
